<style>
:root{--navy:#073d55;--deep:#052c40;--teal:#087f8c;--aqua:#8de0dd;--coral:#f47f68;--sand:#f5bd68;--ink:#183e50;--muted:#637f8c;--bg:#f0f7f8;--line:#dce9ec;--radius:22px}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.6}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f5bd68;outline-offset:4px}button,a,input{-webkit-tap-highlight-color:transparent}header{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:12px}.logo{font-weight:900;font-size:23px;letter-spacing:-1px;display:flex;align-items:center;gap:12px}.logomark{background:var(--navy);color:white;border-radius:13px;width:43px;height:43px;display:grid;place-items:center;font-size:24px}.logo small{font-weight:500;font-size:10px;letter-spacing:2px;display:block;color:var(--muted);margin-top:-5px}.tag{font-size:11px;font-weight:800;letter-spacing:1px;background:#e9f6f4;color:var(--teal);border-radius:20px;padding:7px 12px}.layout{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 78px)}aside{padding:28px 18px;background:#fff;border-right:1px solid var(--line)}.nav{display:flex;flex-direction:column;gap:8px}.nav button{text-align:left;border:0;background:none;color:var(--muted);border-radius:13px;padding:13px 15px;font-weight:700}.nav button.active{color:var(--teal);background:#e9f6f4}.nav button span{margin-right:10px}.sidecard{margin-top:35px;background:#fff7e9;border-radius:18px;padding:17px;font-size:12px;color:#7b653e}.sidecard b{display:block;font-size:14px;margin-bottom:8px}main{padding:30px 36px 50px;max-width:1350px;width:100%;margin:auto}.hero{border-radius:27px;background:linear-gradient(115deg,#073d55,#087e8b);position:relative;overflow:hidden;min-height:255px;display:flex;align-items:center;color:white;padding:34px 38px;gap:24px}.hero:after{content:'';width:320px;height:320px;border:35px solid #ffffff08;position:absolute;right:-100px;bottom:-200px;border-radius:50%}.hero-copy{position:relative;z-index:1;flex:1}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#a5e7dc;text-transform:uppercase}h1{font-size:clamp(28px,3.2vw,43px);line-height:1.17;letter-spacing:-1.3px;margin:14px 0}h2{font-size:22px;line-height:1.35;letter-spacing:-.5px;margin:0 0 8px}h3{margin:0 0 8px;font-size:17px}.hero p{color:#d7eced;font-size:14px;max-width:480px}.sea-art{width:250px;height:190px;flex-shrink:0}.hero .chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:11px;border:1px solid #ffffff33;border-radius:20px;padding:5px 10px;color:#e5f8f7}.section-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.section-top p{margin:0}.muted{font-size:13px;color:var(--muted)}.panel{border:1px solid var(--line);background:white;border-radius:var(--radius);padding:24px}.welcome-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:22px}.formlabel{display:block;font-size:12px;font-weight:750;margin:18px 0 7px}input{padding:12px 14px;border:1px solid #cbdde2;border-radius:12px;width:100%;color:var(--ink);background:#fbfdfd}.avatars{display:flex;gap:10px;flex-wrap:wrap}.avatar{border:2px solid transparent;background:#f0f7f8;border-radius:15px;min-width:54px;height:55px;font-size:29px}.avatar.selected{border-color:var(--teal);background:#e0f5f1}.btn{border:0;border-radius:12px;padding:12px 20px;background:var(--teal);color:white;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn.coral{background:var(--coral);color:#44271c}.btn.ghost{background:#eaf3f5;color:var(--navy)}.full{width:100%;margin-top:20px}.message{color:#a83b32;font-size:13px;min-height:20px}.steps{list-style:none;margin:20px 0 0;padding:0}.steps li{display:flex;gap:12px;margin:18px 0;font-size:13px}.stepnum{background:#e9f6f4;color:var(--teal);height:29px;min-width:29px;border-radius:10px;display:grid;place-items:center;font-weight:800}.steps small{display:block;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}.stat{padding:19px 22px;border:1px solid var(--line);background:white;border-radius:18px}.stat span{font-size:12px;color:var(--muted)}.stat strong{font-size:25px;display:block}.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.mission{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:20px;background:white}.mission .bigicon{font-size:33px}.mission p{font-size:13px;color:var(--muted);margin:0 0 6px}.mission .btn{margin-top:auto}.smalltag{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--teal)}.soon{border-top-color:#bccdd2;background:#f9fbfc}.banner{background:#e3f1f2;border-radius:14px;padding:12px 16px;margin:18px 0;font-size:12px;color:#346473}.progress-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;margin-bottom:9px}.track{height:8px;background:#dfedf0;border-radius:10px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--teal),#64c9bd);border-radius:10px;transition:width .3s}.game-grid{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}.lab{padding:22px;background:white;border:1px solid var(--line);border-radius:22px}.lab svg{width:100%;height:auto;margin-top:10px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.legend div{background:#f3f8f8;padding:11px;border-radius:10px;font-size:11px}.legend b{font-size:12px;display:block}.resultnote{padding:10px 12px;background:#fff6e5;border-radius:10px;font-size:11px;color:#816329;margin-top:10px}.question .skill{font-size:10px;letter-spacing:1.5px;color:var(--teal);font-weight:850;margin-bottom:12px}.question h2{font-size:21px}.options{display:grid;gap:10px;margin-top:22px}.option{border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;display:flex;align-items:flex-start;gap:11px;background:white;color:var(--ink);text-align:left;font-size:13px;line-height:1.5}.option .letter{border-radius:7px;background:#eff5f6;color:var(--muted);min-width:25px;height:25px;display:grid;place-items:center;font-size:11px;font-weight:800}.option.selected{border-color:var(--teal);background:#effaf7}.option.correct{border-color:#39a77c;background:#e9f8f0}.option.wrong{border-color:#df8b78;background:#fff2ed}.option:disabled{opacity:1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.feedback{border-radius:13px;padding:15px;margin-top:17px;font-size:13px;background:#eaf6f2}.feedback.bad{background:#fff2e9}.feedback strong{display:block;margin-bottom:5px}.hint{font-size:12px;padding:12px;background:#fff7e7;border-radius:12px;margin-top:12px}.result-hero{text-align:center;padding:32px;background:linear-gradient(120deg,#073d55,#087f8c);border-radius:24px;color:white}.result-hero h1{font-size:34px}.result-hero p{color:#d4ecec}.score{font-size:55px;font-weight:900;line-height:1.2}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.skillrow{margin-top:17px}.skillrow .track{margin-top:7px}.skillname{display:flex;justify-content:space-between;font-size:12px}.badge-card{background:#fff7e8;border-radius:17px;padding:20px;margin:15px 0}.badge-card .badge-icon{font-size:42px}.reviewitem{border-bottom:1px solid var(--line);padding:15px 0;font-size:13px}.reviewitem:last-child{border-bottom:0}.reviewitem p{margin:6px 0;color:var(--muted)}.learn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:20px}.learn-grid p{font-size:14px}.example{font-size:12px;background:#edf7f7;border-radius:12px;padding:13px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:13px 22px;color:white;background:var(--navy);border-radius:13px;box-shadow:0 8px 25px #073d5522;z-index:10}.foot{margin-top:28px;font-size:11px;color:var(--muted);text-align:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1000px){main{padding:24px}.layout{grid-template-columns:175px 1fr}.sea-art{width:180px}.missions{grid-template-columns:1fr 1fr}.game-grid{grid-template-columns:1fr}.lab{max-width:650px}.hero{padding:28px}.hero h1{font-size:32px}}@media(max-width:650px){header{height:66px;padding:0 16px}.logo{font-size:20px}.tag{font-size:9px;padding:6px 9px}.layout{display:block}aside{position:fixed;bottom:0;left:0;right:0;z-index:5;border:0;border-top:1px solid var(--line);padding:7px 9px}.nav{flex-direction:row;justify-content:space-around;gap:3px}.nav button{font-size:10px;text-align:center;padding:7px 12px}.nav button span{display:block;font-size:20px;margin:0}.sidecard{display:none}main{padding:18px 15px 100px}.hero{padding:25px;min-height:235px}.hero h1{font-size:31px}.sea-art{display:none}.welcome-grid,.result-grid,.learn-grid,.missions{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat span{font-size:10px}.stat strong{font-size:21px}.panel{padding:20px}.toast{bottom:90px;width:85%;text-align:center}.question h2{font-size:20px}.legend div{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}@media print{header,aside,.actions,.noprint{display:none!important}.layout{display:block}main{padding:0}.result-hero{background:white;color:var(--ink)}.result-hero p{color:var(--muted)}.result-grid{display:block}.panel{break-inside:avoid;margin-bottom:15px}}

<body>
<header><div class="logo"><div class="logomark" aria-hidden="true">◈</div><div>SI KUPIS<small>EKSPEDISI SAINS</small></div></div><span class="tag">TAHUN 5 · VERSI PERTAMA</span></header>
<div class="layout"><aside><nav class="nav" aria-label="Navigasi utama"><button data-page="home"><span aria-hidden="true">⌂</span>Utama</button><button data-page="learn"><span aria-hidden="true">▤</span>Belajar</button><button data-page="mission"><span aria-hidden="true">⚑</span>Misi</button><button data-page="achievements"><span aria-hidden="true">☆</span>Pencapaian</button></nav><div class="sidecard"><b>🐚 Sedikit demi sedikit.</b>Perhatikan bukti. Fikirkan sebab. Setiap cubaan membantu kamu belajar.</div></aside><main id="app"></main></div><div id="announcer" class="sr" aria-live="polite"></div>
<script>
'use strict';
const KEY='si-kupis-t5-v1';
const app=document.getElementById('app');
const avatars=['🐢','🐙','🐬','🐠','🦀','🐳'];
let storageOK=true, saved={profile:null,best:0,completed:false,last:null};
try{const value=JSON.parse(localStorage.getItem(KEY)||'null');if(value&&typeof value==='object'){saved={...saved,...value};if(!value.profile||typeof value.profile.name!=='string'||!avatars.includes(value.profile.avatar))saved.profile=null;saved.best=Math.max(0,Math.min(12,Number(value.best)||0));}}catch(e){storageOK=false;}
let chosenAvatar=saved.profile?.avatar||avatars[0],page='home',session=null;
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const skills=['Hipotesis','Pemboleh ubah','Pemerhatian','Inferens','Tafsir data','Kesimpulan'];
const questions=[
{skill:'Hipotesis',q:'Sebelum keputusan dibuka, pernyataan manakah boleh diuji dalam penyiasatan ini?',options:['Kehadiran air dan udara menyebabkan bulu besi berkarat.','Bulu besi ialah bahan yang paling cantik.','Semua objek yang berwarna perang ialah besi.'],a:0,hint:'Hipotesis menghubungkan faktor yang diuji dengan hasil yang boleh diperhatikan.',why:'Kita boleh menguji hubungan kehadiran air dan udara dengan keadaan bulu besi melalui susunan tabung yang berbeza.'},
{skill:'Pemboleh ubah',q:'Apakah pemboleh ubah yang dimanipulasikan?',options:['Kehadiran air dan udara.','Keadaan bulu besi selepas empat hari.','Kuantiti bulu besi, iaitu 20 g.'],a:0,hint:'Cari perkara yang sengaja dibezakan antara susunan tabung.',why:'Kehadiran air dan udara dibezakan. Keadaan bulu besi ialah hasil yang diperhatikan, manakala kuantitinya dikekalkan.'},
{skill:'Pemboleh ubah',q:'Semua tabung mengandungi 20 g bulu besi. Mengapakah kuantiti ini sama?',options:['Supaya kuantiti bulu besi menjadi pemboleh ubah dimalarkan.','Supaya semua tabung pasti berkarat.','Supaya kuantiti bulu besi menjadi perkara yang diukur selepas ujian.'],a:0,hint:'Ujian adil memerlukan perkara selain faktor yang diuji dikekalkan.',why:'Kuantiti bulu besi dikekalkan supaya perbandingan lebih adil. Kehadiran air dan udara ialah faktor yang diuji.'},
{skill:'Hipotesis',q:'Rakan kamu berkata, “Semakin besar tabung, semakin banyak karat.” Adakah ini hipotesis yang sesuai untuk ujian ini?',options:['Tidak. Saiz tabung bukan faktor yang sengaja diuji.','Ya. Semua hipotesis mesti bermula dengan “semakin”.','Ya. Apa-apa ayat tentang karat boleh diterima.'],a:0,hint:'Semak sama ada faktor dalam ayat itu benar-benar diubah dalam ujian.',why:'Hipotesis mesti sesuai dengan pemboleh ubah penyiasatan. Ayat “semakin… semakin…” tidak wajib untuk faktor hadir atau tiada.'},
{skill:'Pemerhatian',q:'Lihat keputusan contoh selepas empat hari. Ayat manakah ialah pemerhatian?',options:['Terdapat lapisan perang kemerahan pada bulu besi dalam A dan D.','A dan D berkarat kerana air dan udara hadir.','Bulu besi mungkin lebih suka tabung D.'],a:0,hint:'Pemerhatian menyatakan perkara yang dilihat atau diukur, tanpa menerangkan sebab.',why:'Lapisan perang kemerahan ialah perubahan yang dapat dilihat. Ayat yang menyebut “kerana air dan udara hadir” pula memberi penjelasan.'},
{skill:'Inferens',q:'Mengapakah bulu besi dalam tabung B tidak berkarat?',options:['Kalsium klorida kontang menyerap kelembapan, menyebabkan keadaan kering.','Bulu besi langsung tidak bersentuhan dengan udara.','Semua bulu besi kebal daripada pengaratan.'],a:0,hint:'Tabung B mengandungi bahan yang menyerap kelembapan.',why:'Udara hadir dalam B, tetapi kalsium klorida kontang mengekalkan keadaan kering. Air yang diperlukan untuk pengaratan tidak tersedia.'},
{skill:'Tafsir data',q:'Pasangan tabung manakah menunjukkan pengaratan dalam keputusan contoh ini?',options:['A dan D.','B dan C.','A dan B.'],a:0,hint:'Rujuk lajur “Keputusan” dalam jadual, bukan sekadar rupa tabung.',why:'A mengandungi udara lembap, manakala D mengandungi air paip dan udara. Kedua-duanya menyediakan air dan udara.'},
{skill:'Pemerhatian',q:'Pilih catatan yang paling sesuai untuk keputusan tabung C.',options:['Tiada lapisan perang kemerahan diperhatikan pada bulu besi.','Bulu besi tidak berkarat kerana udara dihalang.','Minyak pasti menyebabkan semua besi menjadi lebih kuat.'],a:0,hint:'Catat perkara yang diperhatikan dahulu. Penjelasan sebab diletakkan dalam inferens.',why:'Ketiadaan lapisan perang kemerahan ialah pemerhatian. Peranan minyak dan air yang dididihkan digunakan dalam penjelasan inferens.'},
{skill:'Inferens',q:'Tabung C menggunakan air yang telah dididihkan dan lapisan minyak. Apakah penjelasan susunan ini?',options:['Pendidihan menyingkirkan udara terlarut dan minyak menghalang udara masuk semula.','Minyak menambahkan udara ke dalam air.','Pendidihan menukarkan bulu besi menjadi kaca.'],a:0,hint:'Fikirkan faktor yang hendak ditiadakan dalam C walaupun air masih hadir.',why:'Susunan C menguji keadaan air hadir tetapi udara dikecualikan. Air dididihkan dan dilindungi lapisan minyak bagi tujuan itu.'},
{skill:'Tafsir data',q:'A berkarat tetapi B tidak. Kedua-duanya mempunyai udara. Apakah yang disokong oleh perbandingan ini?',options:['Kehadiran air atau kelembapan mempengaruhi pengaratan apabila udara hadir.','Udara sahaja sentiasa mencukupi untuk pengaratan.','Kuantiti bulu besi dalam A pasti lebih banyak.'],a:0,hint:'Bandingkan faktor yang berbeza antara A dan B.',why:'A mempunyai kelembapan, manakala B dikeringkan. Kuantiti bulu besi adalah sama. Perbandingan ini menyokong peranan air bersama udara.'},
{skill:'Kesimpulan',q:'Apakah kesimpulan yang menjawab tujuan penyiasatan ini?',options:['Besi berkarat apabila kedua-dua air dan udara hadir.','Semua logam berkarat dalam setiap keadaan.','Besi hanya memerlukan udara, tanpa air.'],a:0,hint:'Gunakan keseluruhan keputusan A hingga D, bukan satu tabung sahaja.',why:'A dan D berkarat, sementara B dan C tidak. Keputusan contoh menyokong keperluan kedua-dua air dan udara untuk pengaratan besi.'},
{skill:'Kesimpulan',q:'Situasi baharu: rantai basikal besi disapu gris. Penjelasan manakah paling sesuai?',options:['Gris membantu menghalang rantai daripada terdedah kepada air dan udara.','Gris menukarkan besi kepada plastik.','Gris membolehkan lebih banyak air menyentuh besi.'],a:0,hint:'Gunakan kesimpulan tentang faktor pengaratan untuk menerangkan perlindungan permukaan.',why:'Lapisan gris mengurangkan sentuhan dengan air dan udara, lalu membantu mencegah pengaratan. Besi tidak bertukar menjadi bahan lain.'}
];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){storageOK=false;}}
function announce(text){document.getElementById('announcer').textContent=text;}
function mix(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function foot(){return '<div class="foot">SI KUPIS · Cikgu Amira Shakira · SK Sementa<br>Versi latihan kendiri. Pencapaian disimpan pada browser ini sahaja'+(storageOK?'.':' jika storan tersedia.')+'<br>Tiada akaun murid, penghantaran skor kepada guru atau penetapan TP automatik.</div>';}
function art(){return '<svg class="sea-art" viewBox="0 0 280 210" aria-hidden="true"><circle cx="145" cy="103" r="86" fill="#ffffff0b"/><circle cx="54" cy="42" r="6" fill="none" stroke="#9ce6de" stroke-width="2"/><circle cx="225" cy="27" r="4" fill="none" stroke="#9ce6de" stroke-width="2"/><circle cx="242" cy="83" r="8" fill="none" stroke="#9ce6de" stroke-width="2"/><path d="M24 188Q65 157 103 181T187 177T276 182" fill="none" stroke="#69c6be" stroke-width="5"/><path d="M54 182Q53 140 38 130M58 171Q76 141 71 122M223 181L222 146M222 161L206 149M223 154L237 137" fill="none" stroke="#f3a28d" stroke-width="8" stroke-linecap="round"/><ellipse cx="144" cy="110" rx="62" ry="48" fill="#a5dfb8"/><path d="M104 95L85 71Q64 57 78 83L94 108M105 136L83 153Q72 172 96 156L119 143M176 77L190 62Q207 53 196 75L185 94M179 140L197 155Q215 170 192 160L168 147" fill="#85cba8"/><ellipse cx="206" cy="105" rx="23" ry="22" fill="#a5dfb8"/><circle cx="213" cy="99" r="4" fill="#073d55"/><path d="M210 114Q216 119 221 112" fill="none" stroke="#073d55" stroke-width="2"/><path d="M130 75L155 75L175 95L169 124L144 143L119 129L111 100Z" fill="#3a9c91"/><path d="M130 75L135 100L111 100M135 100L157 98L175 95M135 100L132 121L119 129M132 121L154 124L169 124M154 124L144 143M157 98L154 124" fill="none" stroke="#83ccae" stroke-width="3"/><path d="M33 90Q56 68 78 91Q57 112 33 90L22 78L22 103Z" fill="#f5bd68"/><circle cx="65" cy="86" r="3" fill="#073d55"/></svg>';}
function hero(title,sub){return '<section class="hero"><div class="hero-copy"><div class="eyebrow">Selamat datang, penjelajah kecil</div><h1>'+title+'</h1><p>'+sub+'</p><div class="chips"><span class="chip">🌊 Tema lautan</span><span class="chip">🔎 Fikir berdasarkan bukti</span></div></div>'+art()+'</section>';}
function navState(){document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false');});}
function go(target){if(session&&!session.done&&page==='game'&&target!=='game'){if(!confirm('Tinggalkan misi? Jawapan misi yang belum selesai tidak akan disimpan.'))return;session=null;}page=target;navState();if(target==='home')home();else if(target==='learn')learn();else if(target==='mission')missions();else if(target==='achievements')achievements();window.scrollTo({top:0,behavior:'instant'});}
function home(){app.innerHTML=hero('Lautan ilmu.<br>Pengembaraan kamu.','Teroka kemahiran proses Sains melalui misi, bukti dan penemuan baharu.')+'<div class="welcome-grid"><section class="panel"><span class="smalltag">Pasport penjelajah · Tahun 5</span><h2 style="margin-top:8px">Jom kenalkan diri!</h2><p class="muted">Gunakan nama panggilan atau kod murid.</p><form id="passport"><label class="formlabel" for="name">Nama penjelajah</label><input id="name" maxlength="30" autocomplete="off" placeholder="Contoh: Amira atau M01" value="'+escapeHTML(saved.profile?.name||'')+'" required><span class="formlabel">Pilih teman laut kamu</span><div class="avatars" role="group" aria-label="Pilihan avatar">'+avatars.map((a,i)=>'<button class="avatar '+(a===chosenAvatar?'selected':'')+'" type="button" data-avatar="'+i+'" aria-pressed="'+(a===chosenAvatar)+'" aria-label="'+['Penyu','Sotong kurita','Lumba-lumba','Ikan','Ketam','Paus'][i]+'">'+a+'</button>').join('')+'</div><button class="btn coral full" type="submit">Mula pengembaraan →</button><div class="message" id="error" role="alert"></div></form></section><section class="panel"><span class="smalltag">Cara bermain</span><h2 style="margin-top:8px">Fikir. Cuba. Temui jawapan.</h2><ol class="steps"><li><span class="stepnum">1</span><div><b>Kenali kemahiran</b><small>Baca kad ringkas dengan contoh yang mudah.</small></div></li><li><span class="stepnum">2</span><div><b>Selesaikan misi eksperimen</b><small>Pilih jawapan berdasarkan susunan dan bukti.</small></div></li><li><span class="stepnum">3</span><div><b>Kumpul mutiara ilmu</b><small>Lihat penerangan dan kenal pasti perkara untuk dilatih.</small></div></li></ol><div class="banner">🐢 Tak pasti? Petunjuk disediakan. Belajar mengikut rentak kamu.</div></section></div>'+foot();
app.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{chosenAvatar=avatars[Number(b.dataset.avatar)];app.querySelectorAll('[data-avatar]').forEach(x=>{const on=x===b;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on));});});document.getElementById('passport').onsubmit=e=>{e.preventDefault();const name=document.getElementById('name').value.trim();if(!name){document.getElementById('error').textContent='Masukkan nama panggilan atau kod kamu dahulu.';return;}if(saved.profile&&saved.profile.name!==name){saved.best=0;saved.completed=false;saved.last=null;}saved.profile={name,avatar:chosenAvatar};persist();go('mission');};}
function missions(){app.innerHTML=hero('Sedia menyiasat'+(saved.profile?', '+escapeHTML(saved.profile.name):'')+'?','Pilih misi dan gunakan kemahiran Sains untuk merungkai misteri.')+'<div class="stats"><div class="stat"><span>Penjelajah</span><strong>'+escapeHTML(saved.profile?.avatar||'🐢')+' '+escapeHTML(saved.profile?.name||'Tetamu')+'</strong></div><div class="stat"><span>Mutiara terbaik</span><strong>'+saved.best+' / 12 🐚</strong></div><div class="stat"><span>Misi tersedia</span><strong>1 misi</strong></div></div><div class="section-top"><h2>Peta pengembaraan</h2><span class="muted">Sains Tahun 5</span></div><div class="missions"><article class="mission"><span class="smalltag">Pengaratan · Boleh dimainkan</span><div class="bigicon">🔬</div><h3>Misteri Besi Berkarat</h3><p>Empat tabung uji. Dua faktor. Dapatkah kamu menjelaskan keputusan?</p><span class="muted">12 soalan · 6 kemahiran · petunjuk tersedia</span><button class="btn" id="start">Teroka misi →</button></article><article class="mission soon"><span class="smalltag">Elektrik · Dalam perancangan</span><div class="bigicon">💡</div><h3>Cahaya di Stesen Sains</h3><p>Bilangan sel kering, mentol dan susunan litar.</p><span class="muted">Belum tersedia dalam versi ini.</span></article><article class="mission soon"><span class="smalltag">Tumbuhan · Dalam perancangan</span><div class="bigicon">🌱</div><h3>Pengembaraan Biji Benih</h3><p>Kenali ciri biji benih dan cara pencarannya.</p><span class="muted">Belum tersedia dalam versi ini.</span></article></div>'+foot();document.getElementById('start').onclick=()=>{if(!saved.profile){go('home');announce('Masukkan nama penjelajah dahulu.');return;}start();};}
function start(){session={i:0,answers:[],hint:false,selected:null,checked:false,done:false,options:questions.map(q=>mix(q.options.map((text,id)=>({text,id}))))};page='game';navState();game();window.scrollTo({top:0,behavior:'instant'});}
function lab(reveal){const tubes=[{x:25,label:'A',water:false,oil:false,dry:false,rust:reveal},{x:120,label:'B',water:false,oil:false,dry:true,rust:false},{x:215,label:'C',water:true,oil:true,dry:false,rust:false},{x:310,label:'D',water:true,oil:false,dry:false,rust:reveal}];return '<section class="lab"><span class="smalltag">Makmal bukti · '+(reveal?'Selepas 4 hari':'Sebelum penyiasatan')+'</span><h3 style="margin-top:8px">Air + udara: apakah kesannya?</h3><p class="muted">Setiap tabung mengandungi 20 g bulu besi dan ditutup dengan gabus.</p><svg viewBox="0 0 410 215" role="img" aria-label="Empat tabung uji A, B, C dan D. Butiran kandungan diterangkan di bawah.">'+tubes.map(t=>'<g transform="translate('+t.x+',0)"><text x="30" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#073d55">'+t.label+'</text><path d="M5 42V159Q5 195 30 195Q55 195 55 159V42" fill="#ecf6fa" stroke="#91b8c6" stroke-width="2"/>'+(t.water?'<path d="M7 98H53V159Q53 191 30 191Q7 191 7 159Z" fill="#b6dce7"/>':'')+(t.oil?'<rect x="7" y="87" width="46" height="12" fill="#e7c96b"/>':'')+(t.dry?'<path d="M8 170L18 161L28 171L39 162L52 173V180Q30 204 8 180Z" fill="#e4dbc4"/>':'')+'<ellipse cx="30" cy="'+(t.dry?'142':'161')+'" rx="17" ry="15" fill="'+(t.rust?'#b96535':'#73848b')+'"/>'+[0,1,2,3].map(i=>'<path d="M15 '+((t.dry?133:152)+i*5)+'Q28 '+((t.dry?145:164)+i*3)+' 46 '+((t.dry?133:152)+i*5)+'" stroke="'+(t.rust?'#e2a264':'#b5c6ca')+'" stroke-width="1.5" fill="none"/>').join('')+'<rect x="2" y="32" width="56" height="15" rx="4" fill="#c49b69"/></g>').join('')+'</svg><div class="legend"><div><b>A · Udara lembap</b>Air hadir sebagai kelembapan; udara hadir.</div><div><b>B · Keadaan kering</b>Kalsium klorida kontang menyerap kelembapan; udara hadir.</div><div><b>C · Air tanpa udara</b>Air dididihkan dan dilapisi minyak untuk mengecualikan udara.</div><div><b>D · Air paip + udara</b>Air dan udara hadir.</div></div>'+(reveal?'<div class="resultnote">Keputusan contoh latihan berdasarkan konsep penyiasatan; bukan data sebenar murid.</div><table style="width:100%;font-size:12px;border-collapse:collapse;margin-top:12px"><caption class="sr">Keputusan selepas empat hari</caption><thead><tr><th style="text-align:left">Tabung</th><th style="text-align:left">Keputusan contoh</th></tr></thead><tbody>'+['A','B','C','D'].map((x,i)=>'<tr><td style="padding:7px">'+x+'</td><td>'+(i===0||i===3?'Lapisan perang kemerahan; berkarat.':'Tiada lapisan perang kemerahan; tidak berkarat.')+'</td></tr>').join('')+'</tbody></table>':'<div class="resultnote">Buat hipotesis dahulu. Keputusan contoh dibuka selepas soalan 4.</div>')+'<p class="muted" style="font-size:10px;margin-bottom:0">Diadaptasi daripada buku teks Sains Tahun 5, hlm. 168–169; DSKP 7.1.3. Ilustrasi skematik.</p></section>';}
function game(){const q=questions[session.i];const score=session.answers.filter(a=>a.correct).length;app.innerHTML='<div class="section-top" style="margin-top:0"><div><span class="smalltag">Misi 01 · Pengaratan</span><h2>Misteri Besi Berkarat</h2></div><span class="tag">'+escapeHTML(saved.profile.avatar)+' '+escapeHTML(saved.profile.name)+'</span></div><div class="progress-head"><span>Soalan '+(session.i+1)+' daripada 12</span><span>'+score+' mutiara 🐚</span></div><div class="track" role="progressbar" aria-label="Kemajuan soalan dijawab" aria-valuemin="0" aria-valuemax="12" aria-valuenow="'+session.answers.length+'"><div class="bar" style="width:'+(session.answers.length/12*100)+'%"></div></div><div class="game-grid">'+lab(session.i>=4)+'<section class="panel question"><div class="skill">'+q.skill.toUpperCase()+'</div><h2 tabindex="-1" id="qtitle">'+q.q+'</h2><p class="muted">Pilih satu jawapan. Mutiara dikira daripada jawapan pertama.</p><div class="options">'+session.options[session.i].map((o,n)=>'<button class="option" data-choice="'+o.id+'" aria-pressed="false"><span class="letter">'+String.fromCharCode(65+n)+'</span><span>'+o.text+'</span></button>').join('')+'</div><div id="hintarea"></div><div id="feedback" role="status"></div><div class="actions"><button class="btn" id="check" disabled>Semak jawapan</button><button class="btn ghost" id="hintbtn">💡 Petunjuk</button></div><div class="muted" style="font-size:11px;margin-top:14px">Petunjuk boleh digunakan tanpa kehilangan mata. Penggunaan petunjuk dicatat berasingan.</div></section></div>'+foot();app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(session.checked)return;session.selected=Number(b.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>{const on=x===b;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on));});document.getElementById('check').disabled=false;});document.getElementById('hintbtn').onclick=()=>{session.hint=true;document.getElementById('hintarea').innerHTML='<div class="hint">💡 '+q.hint+'</div>';document.getElementById('hintbtn').disabled=true;announce(q.hint);};document.getElementById('check').onclick=check;}
function check(){if(session.checked||session.selected===null)return;session.checked=true;const q=questions[session.i],correct=session.selected===q.a;session.answers.push({index:session.i,selected:session.selected,correct,hint:session.hint});app.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(Number(b.dataset.choice)===q.a)b.classList.add('correct');else if(Number(b.dataset.choice)===session.selected)b.classList.add('wrong');});document.getElementById('hintbtn').disabled=true;document.getElementById('feedback').innerHTML='<div class="feedback '+(correct?'':'bad')+'"><strong>'+(correct?'🐚 Tepat! +1 mutiara':'🔎 Mari fahami jawapannya.')+'</strong>'+q.why+'</div>';const btn=document.getElementById('check');btn.textContent=session.i===11?'Lihat penemuan saya →':session.i===3?'Buka keputusan eksperimen →':'Soalan seterusnya →';btn.onclick=next;announce((correct?'Jawapan betul. ':'Jawapan belum tepat. ')+q.why);}
function next(){if(!session.checked)return;if(session.i===11){finish();return;}session.i++;session.hint=false;session.checked=false;session.selected=null;game();document.getElementById('qtitle').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function finish(){session.done=true;const score=session.answers.filter(a=>a.correct).length;saved.best=Math.max(saved.best,score);saved.completed=true;saved.last={score,answers:session.answers,at:new Date().toISOString()};persist();page='achievements';navState();results(saved.last,true);window.scrollTo({top:0,behavior:'instant'});}
function learn(){const data=[['Pemerhatian','Perkara yang boleh dilihat atau diukur.','Terdapat lapisan perang kemerahan pada bulu besi.'],['Inferens','Penjelasan munasabah bagi pemerhatian.','Bulu besi berkarat kerana terdedah kepada air dan udara.'],['Pemboleh ubah','Perkara yang diubah, diperhatikan/diukur dan dikekalkan dalam ujian.','Dimanipulasikan: kehadiran air dan udara. Bergerak balas: keadaan bulu besi. Dimalarkan: kuantiti bulu besi.'],['Hipotesis','Pernyataan hubungan yang boleh diuji sebelum keputusan diketahui.','Kehadiran air dan udara menyebabkan bulu besi berkarat.'],['Tafsir data','Cari pola dan hubungan yang disokong keputusan.','Bandingkan A yang lembap dengan B yang kering apabila kedua-duanya mempunyai udara.'],['Kesimpulan','Rumusan yang menjawab tujuan penyiasatan berdasarkan keseluruhan keputusan.','Keputusan menyokong bahawa besi memerlukan kedua-dua air dan udara untuk berkarat.']];app.innerHTML=hero('Kenali alat fikir<br>seorang saintis.','Baca maksud, lihat contoh, kemudian gunakan kemahiran ini dalam misi.')+'<div class="learn-grid">'+data.map((d,i)=>'<article class="panel"><span class="smalltag">Kemahiran 0'+(i+1)+'</span><h2 style="margin-top:10px">'+d[0]+'</h2><p>'+d[1]+'</p><div class="example"><b>Contoh pengaratan</b><br>'+d[2]+'</div></article>').join('')+'</div><div class="actions"><button class="btn" id="learnmission">Pergi ke misi →</button></div>'+foot();document.getElementById('learnmission').onclick=()=>go('mission');}
function achievements(){if(saved.last&&Array.isArray(saved.last.answers)&&saved.last.answers.length===12){results(saved.last,false);}else{app.innerHTML=hero('Setiap penemuan<br>bermula dengan cubaan.','Lengkapkan misi pertama untuk melihat keputusan dan mendapatkan lencana penyiapan.')+'<section class="panel" style="margin-top:20px"><h2>🐚 Koleksi masih kosong</h2><p class="muted">Mutiara terbaik dikira daripada skor tertinggi satu misi. Mengulang misi tidak menambah mutiara tanpa had.</p><button class="btn" id="emptygo">Pilih misi →</button></section>'+foot();document.getElementById('emptygo').onclick=()=>go('mission');}}
function results(result,fresh){const answers=result.answers;app.innerHTML='<section class="result-hero"><div style="font-size:42px">'+escapeHTML(saved.profile?.avatar||'🐢')+'</div><div class="eyebrow">Misi pengaratan selesai</div><h1>Terima kasih kerana menyiasat,<br>'+escapeHTML(saved.profile?.name||'penjelajah')+'!</h1><div class="score">'+result.score+'<span style="font-size:24px;font-weight:500"> / 12</span></div><p>Ketepatan jawapan pertama · '+Math.round(result.score/12*100)+'%</p></section><div class="result-grid"><section class="panel"><h2>Penemuan mengikut kemahiran</h2><p class="muted">Dua soalan setiap kemahiran. Ini petunjuk latihan awal, bukan pengesahan penguasaan atau TP PBD.</p>'+skills.map(s=>{const items=answers.filter(a=>questions[a.index]?.skill===s),score=items.filter(a=>a.correct).length;return '<div class="skillrow"><div class="skillname"><b>'+s+'</b><span>'+score+' / '+items.length+'</span></div><div class="track"><div class="bar" style="width:'+(items.length?score/items.length*100:0)+'%"></div></div></div>';}).join('')+'<p class="muted" style="margin-top:20px">Petunjuk digunakan: '+answers.filter(a=>a.hint).length+' soalan.</p></section><section class="panel"><h2>Koleksi penjelajah</h2><div class="badge-card"><div class="badge-icon">🏅</div><h3>Penjelajah Pengaratan</h3><p class="muted">Lencana penyiapan: kamu melengkapkan kesemua 12 soalan.</p></div><p><b>🐚 Mutiara terbaik: '+saved.best+' / 12</b></p><p class="muted">Skor tertinggi disimpan. Ulangan misi tidak menggandakan ganjaran. Cuba konteks lain bersama guru untuk mengukuhkan kefahaman.</p><div class="actions"><button class="btn" id="retry">Cuba misi semula</button><button class="btn ghost" id="study">Ulang kaji</button><button class="btn ghost" onclick="window.print()">Cetak</button></div></section></div><section class="panel" style="margin-top:20px"><h2>Semak dan fahami</h2>'+answers.map(a=>{const q=questions[a.index];return '<article class="reviewitem"><span class="smalltag">'+(a.correct?'✓ Betul':'↻ Perlu pengukuhan')+' · '+q.skill+'</span><div><b>'+q.q+'</b></div><p>Jawapan kamu: '+q.options[a.selected]+'</p><p><b>Jawapan tepat: '+q.options[q.a]+'</b></p><p>'+q.why+'</p></article>';}).join('')+'</section><div class="banner">Rekod ini tersimpan pada browser/peranti ini sahaja. Ia belum dihantar kepada guru dan boleh hilang jika data browser dipadam.</div>'+foot();document.getElementById('retry').onclick=start;document.getElementById('study').onclick=()=>go('learn');if(fresh)announce('Misi selesai. Kamu mendapat '+result.score+' daripada 12.');}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));go('home');
</script>
</body>
</html>
