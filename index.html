function validAttempt(a){return a&&typeof a.id==='string'&&typeof a.mission==='string'&&typeof a.code==='string'&&typeof a.className==='string'&&Array.isArray(a.responses)&&a.responses.length<=40&&a.responses.every(r=>r&&typeof r.skill==='string'&&typeof r.correct==='boolean')&&Number.isFinite(a.score)&&Number.isFinite(a.total)&&a.total>0&&a.total<=40&&a.score>=0&&a.score<=a.total;}

function announce(t){document.getElementById('announcer').textContent=t;}
function shuffle(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function uid(){return crypto.randomUUID?crypto.randomUUID():('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);}));}
function personKey(p=data.profile){return p?String(p.className).trim().toUpperCase()+'|'+String(p.code).trim().toUpperCase():'';}
function myAttempts(){return data.attempts.filter(a=>a.person===personKey());}
function summary(attempts){const best=new Map();attempts.forEach(a=>{if(!best.has(a.mission)||a.score>best.get(a.mission).score)best.set(a.mission,a);});return{done:best.size,pearls:[...best.values()].reduce((s,a)=>s+a.score,0),total:[...best.values()].reduce((s,a)=>s+a.total,0)};}

/span><h3>'+esc(data.profile?.name||'Pengembaraan bermula di sini')+'</h3><div class="journey-stats"><div><strong>'+s.pearls+'</strong><span>MUTIARA TERBAIK</span></div><div><strong>'+s.done+'/'+MISSIONS.length+'</strong><span>MISI SELESAI</span></div><div><strong>'+s.done+'</strong><span>LENCANA PENYIAPAN</span></div></div><div class="track"><div class="bar" style="width:'+(s.done/MISSIONS.length*100)+'%"></div></div><p class="muted">Ganjaran menggunakan skor terbaik setiap misi. Ulangan tidak menggandakan mutiara tanpa had.</p></section></div>'+foot();bindCards();document.getElementById('homeMissions').onclick=()=>go('mission');document.getElementById('homeStart').onclick=()=>go(data.profile?.code?'mission':'passport');document.getElementById('homePassport').onclick=()=>go('passport');document.getElementById('posterOpen').onclick=()=>{dialog.innerHTML='<button class="modal-close" aria-label="Tutup poster">×</button><h2 id="modalTitle">Poster asal SI KUPIS</h2><img src="si-kupis-poster.png" alt="Poster SI KUPIS dengan lapan kunci panduan" style="width:100%;border-radius:15px">';dialog.querySelector('button').onclick=()=>dialog.close();dialog.showModal();};document.getElementById('skillSearch').oninput=e=>{let n=0;const term=e.target.value.toLowerCase();app.querySelectorAll('[data-skill]').forEach(b=>{const yes=coreSkills[Number(b.dataset.skill)].join(' ').toLowerCase().includes(term);b.hidden=!yes;if(yes)n++;});document.getElementById('skillEmpty').classList.toggle('hidden',!!n);};}
function passport(){app.innerHTML=hero('Pasport penjelajah kamu.','Kod murid dan kelas membantu guru membezakan rekod. Gunakan kod yang diberi guru, bukan nombor pengenalan.')+'<section class="panel passport-panel"><form id="passportForm"><h2>Jom kenalkan diri</h2><label class="formlabel" for="nickname">Nama panggilan</label><input id="nickname" maxlength="30" required value="'+esc(data.profile?.name||'')+'" placeholder="Contoh: Amira"><div class="filter-grid"><div><label class="formlabel" for="studentCode">Kod murid</label><input id="studentCode" maxlength="24" pattern="[A-Za-z0-9_-]+" required value="'+esc(data.profile?.code||'')+'" placeholder="Contoh: M01"></div><div><label class="formlabel" for="className">Kelas Tahun 5</label><input id="className" maxlength="30" required value="'+esc(data.profile?.className||'')+'" placeholder="Contoh: 5 UPSI"></div></div><span class="formlabel">Pilih teman laut</span><div class="avatars">'+avatars.map((a,i)=>'<button class="avatar '+(a===chosenAvatar?'selected':'')+'" type="button" data-avatar="'+i+'" aria-label="Avatar '+i+'" aria-pressed="'+(a===chosenAvatar)+'">'+a+'</button>').join('')+'</div><button class="btn coral full" type="submit">Simpan pasport & pilih misi →</button><p class="muted">Tahun 5 · Kod yang sama perlu digunakan bagi rekod murid yang sama. Pada peranti berkongsi, tukar pasport sebelum murid lain bermain.</p></form></section>'+foot();app.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{chosenAvatar=avatars[Number(b.dataset.avatar)];app.querySelectorAll('[data-avatar]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b));});});document.getElementById('passportForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('nickname').value.trim(),code=document.getElementById('studentCode').value.trim().toUpperCase(),className=document.getElementById('className').value.trim().toUpperCase();if(!name||!code||!className){announce('Lengkapkan semua function start(id,mode='latihan'){if(!data.profile?.code||!data.profile?.className){go('passport');announce('Lengkapkan pasport dahulu.');return;}const m=MISSIONS.find(x=>x.id===id);if(!m)return;const qs=m.questions.slice();gameState={mission:m,qs,i:0,mode,selected:null,order:[],attemptNo:0,responses:[],hint:false,checked:false,done:false,options:qs.map(q=>shuffle(q.options.map((text,id)=>({text,id})))),tokens:qs.map(q=>shuffle((q.tokens||[]).map((text,id)=>({text,id})))),started:Date.now()};page='game';nav();game();window.scrollTo(0,0);}

function labPanel(m,reveal){const table='<div class="data-scroll"><table><caption>'+(reveal?'Keputusan contoh latihan':'Susunan / maklumat penyiasatan')+'</caption><thead><tr>'+m.heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+m.rows.map(row=>'<tr>'+row.map((x,i)=>'<td>'+((!reveal&&i===row.length-1&&m.reveal>0)?'🔒 Selepas ramalan / hipotesis':esc(x))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
 return '<section class="lab"><span class="smalltag">Makmal bukti · '+m.topic+'</span><h3>'+m.title+'</h3><p class="muted">'+m.desc+'</p>'+(m.id==='R02'?rustIllustration(reveal):sceneSVG(m))+(m.controls?'<p class="muted"><b>Dikekalkan:</b> '+m.controls+'.</p>':'')+table+'<div class="resultnote">'+(reveal?'Data/keputusan contoh untuk latihan. Bukan data sebenar murid.':'Keputusan dibuka selepas soalan awal penyiasatan.')+'</div>'+(m.note?'<p class="muted" style="font-size:11px">'+m.note+'</p>':'')+'<p class="muted" style="font-size:10px">'+m.source+' · Ilustrasi skematik, bukan ukuran radas sebenar.</p></section>';}
function game(){const g=gameState,m=g.mission,q=g.qs[g.i],n=g.qs.length;app.innerHTML='<div class="section-top" style="margin-top:0"><div><span class="smalltag">'+m.topic+' · '+(g.mode==='latihan'?'BELAJAR BERSAMA SI KUPIS':'CABARAN SAINTIS')+'</span><h2>'+m.title+'</h2></div><span class="tag">'+esc(data.profile.avatar)+' '+esc(data.profile.code)+' · '+esc(data.profile.className)+'</span></div><div class="progress-head"><span>Soalan '+(g.i+1)+' / '+n+'</span><span>'+g.responses.filter(r=>r.correct).length+' jawapan pertama tepat</span></div><div class="track" role="progressbar" aria-label="Kemajuan misi" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+g.responses.length+'"><div class="bar" style="width:'+(g.responses.length/n*100)+'%"></div></div><div class="game-grid">'+labPanel(m,g.i>=m.reveal)+'<section class="panel question"><span class="skill">'+q.skill.toUpperCase()+'</span><h2 id="questionTitle" tabindex="-1">'+q.q+'</h2><p class="muted">'+(q.kind==='order'?'Tekan kepingan mengikut urutan untuk membina ayat.':'Pilih jawapan berdasarkan maklumat penyiasatan.')+'</p>'+(q.kind==='order'?'<div class="order-answer" id="orderAnswer">Ayat kamu akan muncul di sini.</div><div class="order-bank">'+g.tokens[g.i].map((t,j)=>'<button class="option" data-token="'+t.id+'">'+esc(t.text)+'</button>').join('')+'</div><button class="btn ghost" id="resetOrder" style="margin-top:10px">Susun semula</button>':'<div class="options">'+g.options[g.i].map((o,j)=>'<button class="option" data-choice="'+o.id+'" aria-pressed="false"><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+esc(o.text)+'</span></button>').join('')+'</div>')+'<div id="hintArea"></div><div id="feedback" role="status"></div><div class="actions"><button class="btn" id="check" disabled>Semak jawapan</button>'+(g.mode==='latihan'?'<button class="btn ghost" id="hintbtn">💡 Petunjuk</button>':'')+'</div><p class="muted" style="font-size:11px">'+(g.mode==='latihan'?'Jawapan pertama, petunjuk dan cubaan semula direkod berasingan.':'Cabaran merekod jawapan pertama tanpa petunjuk. Maklum balas diberi selepas menjawab.')+'</p></section></div>'+foot();if(q.kind==='order'){const update=()=>{document.getElementById('orderAnswer').textContent=g.order.map(i=>q.tokens[i]).join(' ')||'Ayat kamu akan muncul di sini.';document.getElementById('check').disabled=g.order.length!==q.tokens.length;};app.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{if(g.checked)return;g.order.push(Number(b.dataset.token));b.disabled=true;update();});document.getElementById('resetOrder').onclick=()=>{if(g.checked)return;g.order=[];app.querySelectorAll('[data-token]').forEach(b=>b.disabled=false);update();};}else app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(g.checked)return;g.selected=Number(b.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b));});document.getElementById('check').disabled=false;});const hint=document.getElementById('hintbtn');if(hint)hint.onclick=()=>{g.hint=true;hint.disabled=true;document.getElementById('hintArea').innerHTML='<div class="hint">🐚 SI KUPIS: '+q.hint+'</div>';announce(q.hint);};document.getElementById('check').onclick=check;}
function check(){const g=gameState;if(g.checked)return;const q=g.qs[g.i];if(q.kind!=='order'&&g.selected===null)return;if(q.kind==='order'&&g.order.length!==q.tokens.length)return;g.checked=true;g.attemptNo++;const correct=q.kind==='order'?g.order.every((x,i)=>x===i):g.selected===q.a;const answer=q.kind==='order'?g.order.map(i=>q.tokens[i]).join(' '):q.options[g.selected];let r=g.responses.find(r=>r.qid===q.id);if(!r){r={qid:q.id,skill:q.skill,q:q.q,answer,correct,hint:g.hint,tries:1,finalCorrect:correct,correctAnswer:q.options[q.a],why:q.why};g.responses.push(r);}else{r.tries++;r.finalCorrect=correct;}
app.querySelectorAll('[data-choice],[data-token]').forEach(b=>{b.disabled=true;if(b.dataset.choice!==undefined){const id=Number(b.dataset.choice);if(id===q.a&&(correct||g.mode==='cabaran'||g.attemptNo>1))b.classList.add('correct');else if(id===g.selected)b.classList.add(correct?'correct':'wrong');}});if(document.getElementById('resetOrder'))document.getElementById('resetOrder').disabled=true;if(document.getElementById('hintbtn'))document.getElementById('hintbtn').disabled=true;
const showRetry=!correct&&g.mode==='latihan'&&g.attemptNo===1;document.getElementById('feedback').innerHTML='<div class="feedback '+(correct?'':'bad')+'"><strong>'+(correct?'🐚 Tepat!':showRetry?'🔎 Semak bukti sekali lagi.':'🐚 Mari fahami jawapannya.')+'</strong>'+(showRetry?q.hint:q.why)+(showRetry?'':'<p><b>Jawapan: '+esc(q.options[q.a])+'</b></p>')+'</div>';const b=document.getElementById('check');b.textContent=g.i===g.qs.length-1?'Lihat keputusan →':'Seterusnya →';b.onclick=next;if(showRetry){const retry=document.createElement('button');retry.className='btn ghost';retry.textContent='Cuba semula dengan bimbingan';retry.id='retryQuestion';retry.onclick=()=>{g.hint=true;g.selected=null;g.order=[];g.checked=false;game();document.getElementById('hintArea').innerHTML='<div class="hint">🐚 '+q.hint+'</div>';if(document.getElementById('hintbtn'))document.getElementById('hintbtn').disabled=true;};b.parentNode.appendChild(retry);}announce(correct?'Jawapan tepat.':showRetry?q.hint:q.why);}
function next(){const g=gameState;if(!g.checked)return;if(g.i===g.qs.length-1){finish();return;}g.i++;g.selected=null;g.order=[];g.attemptNo=0;g.hint=false;g.checked=false;game();document.getElementById('questionTitle').focus({preventScroll:true});window.scrollTo(0,0);}
function finish(){const g=gameState;if(g.done)return;g.done=true;const r={id:uid(),version:VERSION,person:personKey(),name:data.profile.name,code:data.profile.code,className:data.profile.className,avatar:data.profile.avatar,year:5,mission:g.mission.id,title:g.mission.title,topic:g.mission.topic,mode:g.mode,score:g.responses.filter(r=>r.correct).length,total:g.qs.length,responses:g.responses,at:new Date().toISOString(),seconds:Math.round((Date.now()-g.started)/1000),cloud:'pending'};data.attempts.push(r);save();page='achievements';nav();showResult(r);window.scrollTo(0,0);if(CLOUD.url&&CLOUD.publishableKey)syncPending().then(()=>{const label=document.getElementById('syncStatus');if(label)label.textContent=syncMessage(r);});}
function syncMessage(a){return a.cloud==='sent'?'✓ Rekod ini telah dihantar ke storan pusat.':a.cloud==='error'?'Penghantaran belum berjaya. Rekod kekal pada peranti; cuba Segerakkan semula.':CLOUD.url?'Rekod menunggu penghantaran.':'Rekod pada peranti ini sahaja; sambungan pusat belum diaktifkan.';}
function skillStats(attempts){const out=new Map();attempts.forEach(a=>a.responses.forEach(r=>{if(!out.has(r.skill))out.set(r.skill,{n:0,correct:0,hint:0,retry:0});const v=out.get(r.skill);v.n++;v.correct+=r.correct?1:0;v.hint+=r.hint?1:0;v.retry+=(r.tries||1)>1?1:0;}));return out;}
function skillBars(attempts){return [...skillStats(attempts)].map(([k,v])=>'<div class="skillrow"><div class="skillname"><b>'+esc(k)+'</b><span>'+v.correct+'/'+v.n+' · '+Math.round(v.correct/v.n*100)+'%</span></div><div class="track"><div class="bar" style="width:'+(v.correct/v.n*100)+'%"></div></div><small class="muted">Petunjuk pada jawapan pertama: '+v.hint+' · cubaan semula: '+v.retry+'</small></div>').join('')||'<p class="muted">Belum ada respons.</p>';}
function showResult(r){const s=summary(myAttempts());app.innerHTML='<section class="result-hero"><div class="eyebrow">'+esc(r.mode)+' · '+esc(r.title)+'</div><h1>Penemuan kamu, '+esc(r.name)+'!</h1><div class="score">'+r.score+'<span style="font-size:22px"> / '+r.total+'</span></div><p>Ketepatan jawapan pertama · '+Math.round(r.score/r.total*100)+'%</p></section><div class="result-grid"><section class="panel"><h2>Jejak kemahiran</h2>'+skillBars([r])+'<p class="muted">Bilangan item berbeza mengikut misi. Ini petunjuk latihan, bukan pengesahan penguasaan.</p></section><section class="panel"><h2>Koleksi penjelajah</h2><div class="badge-card"><div class="badge-icon">🏅</div><h3>Lencana penyiapan misi</h3><p>'+esc(r.title)+'</p></div><p>🐚 Mutiara terbaik keseluruhan: <b>'+s.pearls+'</b></p><p class="muted" id="syncStatus">'+esc(syncMessage(r))+'</p><div class="actions"><button class="btn" id="resultReplay">Main semula</button><button class="btn ghost" id="resultMissions">Pilih misi lain</button><button class="btn ghost" id="resultSync">Segerakkan</button><button class="btn ghost" onclick="window.print()">Cetak</button></div></section></div><section class="panel" style="margin-top:20px"><h2>Semak jawapan dan sebab</h2>'+r.responses.map(x=>'<article class="reviewitem"><span class="smalltag">'+esc(x.skill)+' · '+(x.correct?'✓ Jawapan pertama tepat':'↻ Perlu pengukuhan')+'</span><p><b>'+esc(x.q)+'</b></p><p>Jawapan pertama: '+esc(x.answer)+'</p><p>Jawapan tepat: '+esc(x.correctAnswer)+'</p><p>'+esc(x.why)+'</p><small class="muted">'+(x.tries||1)+' cubaan · '+(x.finalCorrect?'jawapan akhir tepat':'jawapan akhir belum tepat')+'</small></article>').join('')+'</section>'+foot();document.getElementById('resultReplay').onclick=()=>start(r.mission,r.mode);document.getElementById('resultMissions').onclick=()=>go('mission');document.getElementById('resultSync').onclick=async e=>{e.target.disabled=true;await syncPending();document.getElementById('syncStatus').textContent=syncMessage(r);e.target.disabled=false;};}
function achievements(){const mine=myAttempts();if(mine.length){showResult(mine[mine.length-1]);return;}app.innerHTML=hero('Koleksi menanti penemuan kamu.','Lengkapkan satu misi untuk mendapatkan lencana penyiapan dan melihat kemahiran yang perlu dilatih.')+'<section class="panel" style="margin-top:20px"><h2>🐚 Belum ada rekod bagi pasport ini</h2><button class="btn" id="emptyMission">Pilih misi</button></section>'+foot();document.getElementById('emptyMission').onclick=()=>go('mission');}
// Dashboard guru: mod peranti jujur; data pusat hanya selepas pengesahan peranan oleh RLS.
function teacher(){app.innerHTML=hero('Dashboard guru.','Pantau jawapan pertama, bantuan dan percubaan mengikut kelas, murid serta kemahiran.')+'<div class="banner">'+(teacherLoggedIn?'Log masuk guru aktif. Gunakan Muat semula untuk mengambil rekod pusat terkini.':CLOUD.url?'Log masuk guru untuk melihat rekod pusat.':'Pratonton peranti: hanya rekod yang tersimpan dalam browser ini. Data murid dari peranti lain belum disambungkan.')+'</div><section class="panel noprint"><h2>Akses dan sumber rekod</h2><form id="teacherLogin"><div class="filter-grid"><div><label class="formlabel" for="teacherEmail">E-mel guru</label><input id="teacherEmail" type="email" autocomplete="username" required></div><div><label class="formlabel" for="teacherPassword">Kata laluan</label><input id="teacherPassword" type="password" autocomplete="current-password" required></div></div><div class="actions"><button class="btn" type="submit" '+(!CLOUD.url?'disabled':'')+'>Log masuk guru</button><button class="btn ghost" type="button" id="loadCloud" '+(!teacherLoggedIn?'disabled':'')+'>Muat semula rekod pusat</button><button class="btn ghost" type="button" id="localPreview">Lihat rekod peranti ini</button><button class="btn ghost" type="button" id="teacherLogout" '+(!teacherLoggedIn?'disabled':'')+'>Log keluar</button></div></form><p id="teacherMessage" class="muted" role="status"></p><div class="actions"><button class="btn ghost" id="exportJSON">Eksport rekod peranti (JSON)</button><label class="btn ghost" for="importJSON">Import rekod JSON</label><input id="importJSON" type="file" accept="application/json,.json" class="sr"></div><p class="muted">Eksport/import membantu semakan manual sebelum sambungan pusat. Fail JSON bukan bukti identiti atau keputusan yang disahkan.</p></section><div id="teacherData"></div>'+foot();document.getElementById('teacherLogin').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{teacherClient=await cloudClient(true);const{error}=await teacherClient.auth.signInWithPassword({email:document.getElementById('teacherEmail').value.trim(),password:document.getElementById('teacherPassword').value});document.getElementById('teacherPassword').value='';if(error)throw error;const{data:role,error:re}=await teacherClient.from('teacher_access').select('user_id').limit(1);if(re)throw re;if(!role?.length){await teacherClient.auth.signOut();throw Error('Akaun ini belum diberi peranan guru.');}teacherLoggedIn=true;await loadTeacher();teacher();}catch(err){document.getElementById('teacherMessage').textContent='Log masuk gagal: '+err.message;}finally{b.disabled=false;}};document.getElementById('loadCloud').onclick=async e=>{e.target.disabled=true;try{await loadTeacher();renderTeacher(teacherRows,'Rekod pusat');document.getElementById('teacherMessage').textContent='Rekod pusat dikemas kini.';}catch(err){document.getElementById('teacherMessage').textContent=err.message;}e.target.disabled=false;};document.getElementById('localPreview').onclick=()=>renderTeacher(data.attempts,'Rekod peranti ini sahaja');document.getElementById('teacherLogout').onclick=async()=>{if(teacherClient)await teacherClient.auth.signOut();teacherClient=null;teacherRows=null;teacherLoggedIn=false;teacher();};document.getElementById('exportJSON').onclick=()=>download('SI_KUPIS_rekod_peranti.json',JSON.stringify({format:'si-kupis-attempts-v3',attempts:data.attempts},null,2),'application/json');document.getElementById('importJSON').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>8e6)throw Error('Fail terlalu besar. Had 8 MB.');const j=JSON.parse(await f.text());if(j.format!=='si-kupis-attempts-v3'||!Array.isArray(j.attempts)||!j.attempts.every(validAttempt))throw Error('Format rekod tidak sah.');const combined=new Map(data.attempts.map(a=>[a.id,a]));j.attempts.forEach(a=>{if(!combined.has(a.id))combined.set(a.id,{...a,cloud:'imported'});});const manual=[...combined.values()];renderTeacher(manual,'Semakan manual: peranti + fail import (belum disimpan/pusat)');document.getElementById('teacherMessage').textContent='Import dibaca untuk semakan sesi ini; tidak dihantar ke pusat atau digabungkan ke rekod peranti.';}catch(err){document.getElementById('teacherMessage').textContent='Import gagal: '+err.message;}};renderTeacher(teacherLoggedIn&&teacherRows?teacherRows:data.attempts,teacherLoggedIn&&teacherRows?'Rekod pusat':'Rekod peranti ini sahaja');}
function teacherSelect(id,values,label){return '<label class="formlabel" for="'+id+'">'+label+'</label><select id="'+id+'"><option value="">Semua</option>'+[...new Set(values)].sort().map(v=>'<option>'+esc(v)+'</option>').join('')+'</select>';}
function renderTeacher(rows,label){teacherViewRows=rows;document.getElementById('teacherData').innerHTML='<section class="panel" style="margin-top:20px"><h2>'+esc(label)+'</h2><div class="filter-grid noprint"><div>'+teacherSelect('tClass',rows.map(a=>a.className),'Kelas')+'</div><div>'+teacherSelect('tTopic',rows.map(a=>a.topic),'Topik')+'</div><div>'+teacherSelect('tMode',rows.map(a=>a.mode),'Mod')+'</div><div><label class="formlabel" for="tCode">Kod / nama murid</label><input id="tCode" placeholder="Cari murid"></div><div><label class="formlabel" for="tDate">Tarikh (Malaysia)</label><input id="tDate" type="date"></div></div><p class="muted">Analisis menggunakan semua percubaan yang dipilih. Latihan dan cabaran boleh ditapis berasingan. Murid unik dikira mengikut kelas + kod.</p><div class="actions noprint"><button class="btn ghost" id="teacherCSV">Eksport CSV pilihan</button><button class="btn ghost" onclick="window.print()">Cetak laporan</button></div></section><div id="teacherStats"></div><div class="result-grid"><section class="panel"><h2>Ketepatan mengikut kemahiran</h2><div id="teacherSkills"></div></section><section class="panel"><h2>Item untuk pengukuhan</h2><div id="teacherIssues"></div></section></div><section class="panel" style="margin-top:20px"><h2>Rekod murid</h2><div class="data-scroll"><table><thead><tr><th>Tarikh</th><th>Kod / nama</th><th>Kelas</th><th>Misi</th><th>Mod</th><th>Skor awal</th><th>Bantuan</th><th>Butiran</th></tr></thead><tbody id="teacherTable"></tbody></table></div></section>';let filtered=[];const update=()=>{const cls=document.getElementById('tClass').value,topic=document.getElementById('tTopic').value,mode=document.getElementById('tMode').value,term=document.getElementById('tCode').value.trim().toLowerCase(),date=document.getElementById('tDate').value;filtered=rows.filter(a=>(!cls||a.className===cls)&&(!topic||a.topic===topic)&&(!mode||a.mode===mode)&&(!term||(a.code+' '+a.name).toLowerCase().includes(term))&&(!date||malaysiaDate(a.at)===date));const answers=filtered.flatMap(a=>a.responses),correct=answers.filter(r=>r.correct).length,unique=new Set(filtered.map(a=>a.className+'|'+a.code)).size;document.getElementById('teacherStats').innerHTML='<div class="stats"><div class="stat"><span>Murid yang mempunyai rekod</span><strong>'+unique+'</strong></div><div class="stat"><span>Percubaan misi lengkap</span><strong>'+filtered.length+'</strong></div><div class="stat"><span>Ketepatan respons pertama</span><strong>'+(answers.length?Math.round(correct/answers.length*100)+'%':'—')+'</strong></div></div>';document.getElementById('teacherSkills').innerHTML=skillBars(filtered);const issues=new Map();answers.filter(r=>!r.correct).forEach(r=>{const k=r.qid;if(!issues.has(k))issues.set(k,{q:r.q,skill:r.skill,n:0});issues.get(k).n++;});document.getElementById('teacherIssues').innerHTML=[...issues.values()].sort((a,b)=>b.n-a.n).slice(0,8).map(x=>'<article class="reviewitem"><span class="smalltag">'+esc(x.skill)+' · '+x.n+' respons awal salah</span><p>'+esc(x.q)+'</p></article>').join('')||'<p class="muted">Tiada respons salah dalam pilihan ini, atau belum ada rekod.</p>';document.getElementById('teacherTable').innerHTML=filtered.slice().reverse().map(a=>'<tr><td>'+esc(formatDate(a.at))+'</td><td>'+esc(a.code)+'<br>'+esc(a.name)+'</td><td>'+esc(a.className)+'</td><td>'+esc(a.title)+'</td><td>'+esc(a.mode)+'</td><td>'+a.score+'/'+a.total+'</td><td>'+a.responses.filter(r=>r.hint).length+' petunjuk<br>'+a.responses.filter(r=>(r.tries||1)>1).length+' ulang</td><td><button class="btn ghost" data-record="'+esc(a.id)+'">Lihat</button></td></tr>').join('')||'<tr><td colspan="8">Tiada rekod sepadan.</td></tr>';app.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>recordDetail(filtered.find(a=>a.id===b.dataset.record)));};['tClass','tTopic','tMode','tDate'].forEach(id=>document.getElementById(id).onchange=update);document.getElementById('tCode').oninput=update;document.getElementById('teacherCSV').onclick=()=>{const cell=v=>{let t=String(v??'');if(/^[=+@\t\r-]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"';};const lines=[['Tarikh','Kod','Nama','Kelas','Misi','Mod','Skor awal','Jumlah','Petunjuk','Ulang'],...filtered.map(a=>[formatDate(a.at),a.code,a.name,a.className,a.title,a.mode,a.score,a.total,a.responses.filter(r=>r.hint).length,a.responses.filter(r=>(r.tries||1)>1).length])];download('SI_KUPIS_laporan.csv','\ufeff'+lines.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');};update();}
function recordDetail(a){if(!a)return;dialog.innerHTML='<button class="modal-close" aria-label="Tutup rekod">×</button><h2 id="modalTitle">'+esc(a.code)+' · '+esc(a.title)+'</h2><p>'+esc(a.className)+' · '+a.score+'/'+a.total+' · '+esc(a.mode)+'</p>'+a.responses.map(r=>'<article class="reviewitem"><b>'+esc(r.skill)+' · '+(r.correct?'Betul':'Salah')+'</b><p>'+esc(r.q)+'</p><p>Respons awal: '+esc(r.answer)+'</p><p>Skema: '+esc(r.correctAnswer)+'</p><small class="muted">Petunjuk: '+(r.hint?'ya':'tidak')+' · '+(r.tries||1)+' cubaan</small></article>').join('');dialog.querySelector('.modal-close').onclick=()=>dialog.close();dialog.showModal();}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function malaysiaDate(iso){const d=new Date(iso);if(!Number.isFinite(d.getTime()))return '';const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);return ['year','month','day'].map(k=>parts.find(p=>p.type===k).value).join('-');}
function formatDate(iso){const d=new Date(iso);return Number.isFinite(d.getTime())?d.toLocaleString('ms-MY',{timeZone:'Asia/Kuala_Lumpur',dateStyle:'short',timeStyle:'short'}):'Tarikh tidak sah';}
async function sdk(){if(window.supabase?.createClient)return window.supabase;if(!window.__siSdk)window.__siSdk=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';script.onload=()=>window.supabase?.createClient?resolve(window.supabase):reject(Error('SDK tidak tersedia.'));script.onerror=()=>reject(Error('Tidak dapat memuatkan sambungan pusat. Semak internet.'));document.head.appendChild(script);}).catch(err=>{window.__siSdk=null;throw err;});return window.__siSdk;}
function checkCloudConfig(){if(!CLOUD.url||!CLOUD.publishableKey)throw Error('Sambungan pusat belum disediakan. Rekod masih disimpan pada peranti.');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(CLOUD.url))throw Error('URL projek Supabase tidak sah.');if(CLOUD.publishableKey.startsWith('sb_secret_'))throw Error('Jangan gunakan secret key dalam app awam.');if(CLOUD.publishableKey.startsWith('eyJ')){try{const p=JSON.parse(atob(CLOUD.publishableKey.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(p.role!=='anon')throw Error('Kunci bukan anon.');}catch(e){throw Error('Gunakan publishable key atau anon key, bukan service_role key.');}}else if(!CLOUD.publishableKey.startsWith('sb_publishable_'))throw Error('Gunakan publishable key projek.');}
async function cloudClient(teacher=false){checkCloudConfig();const s=await sdk();if(teacher)return s.createClient(CLOUD.url,CLOUD.publishableKey,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'si-kupis-teacher-memory'}});if(!cloudPromise)cloudPromise=Promise.resolve(s.createClient(CLOUD.url,CLOUD.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'si-kupis-student-anon'}}));return cloudPromise;}
let syncing=false;
async function syncPending(){if(syncing)return;syncing=true;try{const c=await cloudClient();let {data:s,error}=await c.auth.getSession();if(error)throw error;if(!s.session){const r=await c.auth.signInAnonymously();if(r.error)throw r.error;s=r.data;}const owner=s.session.user.id;for(const a of data.attempts.filter(a=>a.cloud==='pending'||a.cloud==='error')){try{const payload={...a};delete payload.cloud;const{error}=await c.from('attempts').upsert({id:a.id,owner_id:owner,student_code:a.code,class_name:a.className,mission_id:a.mission,payload},{onConflict:'id',ignoreDuplicates:true});if(error)throw error;a.cloud='sent';delete a.cloudError;}catch(err){a.cloud='error';a.cloudError=String(err.message).slice(0,200);}}save();}catch(err){data.attempts.filter(a=>a.cloud==='pending').forEach(a=>{a.cloud='error';a.cloudError=String(err.message).slice(0,200);});save();announce(err.message);}finally{syncing=false;}}
async function loadTeacher(){if(!teacherClient||!teacherLoggedIn)throw Error('Log masuk guru dahulu.');const records=[];for(let offset=0;;offset+=500){const{data:rows,error}=await teacherClient.from('attempts').select('payload,created_at').order('created_at',{ascending:false}).range(offset,offset+499);if(error)throw error;records.push(...rows.filter(r=>validAttempt(r.payload)).map(r=>({...r.payload,cloud:'sent',receivedAt:r.created_at})));if(rows.length<500)break;if(records.length>=20000)throw Error('Lebih 20,000 rekod. Hadkan carian pada pangkalan data untuk analisis lanjut.');}teacherRows=records;}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('profilebtn').onclick=()=>go('passport');go('home');
